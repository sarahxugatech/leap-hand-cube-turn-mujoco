name: Validate measured trajectory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and model assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Replay measured result twice
        run: python scripts/validate_2x2_hand_turn.py

